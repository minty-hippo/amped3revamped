# Amped 3 Revamped - starting settings, copied next to amped3.exe on the first build.
# The in-game options menu (Back+Start or F1) rewrites amped3.toml when you
# change something, so edit it there rather than here once it exists.
# Any setting can also be given on the command line, e.g. --resolution_scale=2

# Fullscreen from the first start (the options menu, F1 > Display, or the
# launcher's Graphics settings switch it).
fullscreen = true

# 16x anisotropic filtering (cheap on any modern GPU).
anisotropic_override = 5
