# Builds the launcher (launcher/) for Windows, Linux x86_64 and Linux arm64.
# Every run keeps the three files as artifacts. On main they are also
# published as the release launcher-v<launcher/VERSION> (made, or its files
# replaced, by this workflow): raise VERSION for a new release. The launcher holds nothing from the game: it
# downloads these sources and builds the game from the player's own disc image.
name: Launcher

on:
  push:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: amped3-launcher-windows-x64.exe
            file: build/Release/amped3-launcher.exe
          - os: ubuntu-22.04
            name: amped3-launcher-linux-x86_64
            file: build/amped3-launcher
          - os: ubuntu-22.04-arm
            name: amped3-launcher-linux-arm64
            file: build/amped3-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies (SDL3's X11 / Wayland / D-Bus, loaded at run time)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdecor-0-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S launcher -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          strip build/amped3-launcher

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cmake -S launcher -B build -A x64 2>&1 | tee configure.log
          cmake --build build --config Release 2>&1 | tee build.log
          test -f build/Release/amped3-launcher.exe

      # Compiler errors as annotations, readable without the full log.
      - name: Report errors
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          # One annotation per log (they're limited in number): its error
          # lines and its last lines.
          for f in configure.log build.log; do
            [ -f "$f" ] || continue
            text="$( { grep -E "CMake Error|error C[0-9]|error MSB|fatal error|: error" "$f" | head -25
                       echo "-- last lines of $f:"; tail -n 25 "$f"; } | tr -d '\r')"
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            echo "::error title=$f::$text"
          done
          exit 0

      - name: Name the file
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.file }}" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "tag=launcher-v$(tr -d '[:space:]' < launcher/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Linux files are executable
        run: chmod +x dist/amped3-launcher-linux-*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          overwrite_files: true
          make_latest: true
          name: Launcher ${{ steps.version.outputs.tag }}
          body: |
            The Amped 3 Revamped launcher. Download the one for your system, run it, choose your
            Amped 3 (Xbox 360) disc image and select Build and install. It downloads this
            project's sources and builds the game on your computer; nothing from the game is
            included or downloaded.

            - Windows: amped3-launcher-windows-x64.exe
            - Linux / SteamOS (x86_64): amped3-launcher-linux-x86_64
            - Linux ARM handhelds such as Armada (arm64): amped3-launcher-linux-arm64
